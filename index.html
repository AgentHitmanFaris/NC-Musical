<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuScriptor GUI — AI Music Transcription</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0b10;
            --bg-surface: rgba(20, 22, 32, 0.7);
            --bg-card: rgba(30, 32, 47, 0.4);
            --border-glow: rgba(99, 102, 241, 0.25);
            --border-hover: rgba(99, 102, 241, 0.5);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a855f7;
            --accent: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .sidebar {
            width: 360px;
            min-width: 360px;
            height: 100vh;
            background: rgba(10, 11, 16, 0.96);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.25rem;
            overflow-y: auto;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10;
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary) 70%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span.badge {
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.15rem 0.45rem;
            border-radius: 99px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--primary);
            color: var(--text-main);
            -webkit-text-fill-color: var(--text-main);
        }

        .server-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            background: var(--bg-surface);
            padding: 0.35rem 0.75rem;
            border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gpu-badge {
            font-size: 0.72rem;
            color: var(--accent);
            font-weight: 500;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .status-dot.online {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .workspace {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #07080c;
        }

        .glass-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: 0.75rem;
            padding: 1.2rem;
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.2);
            transition: border-color 0.3s ease;
        }

        .glass-panel:hover {
            border-color: var(--border-hover);
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            border-left: 3px solid var(--primary);
            padding-left: 0.5rem;
        }

        .form-group {
            margin-bottom: 0.75rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        select, input[type="text"] {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.35rem;
            color: var(--text-main);
            padding: 0.5rem 0.75rem;
            font-family: var(--font-main);
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--primary);
        }

        /* Tabs styling */
        .tabs {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.2rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.4rem;
            border-radius: 0.35rem;
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        /* Dropzone & Input Panel Styling */
        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 120px;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .dropzone svg {
            width: 32px;
            height: 32px;
            color: var(--primary);
            transition: transform 0.3s ease;
        }

        .dropzone:hover svg {
            transform: translateY(-3px);
        }

        .dropzone-text h3 {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .dropzone-text p {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .youtube-input-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
            padding: 1.5rem 1rem;
            min-height: 120px;
        }

        .youtube-input-container svg {
            width: 36px;
            height: 36px;
            color: #ef4444;
        }

        .file-info {
            display: none;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.35rem;
            padding: 0.5rem 0.75rem;
            margin-top: 0.5rem;
            align-items: center;
            justify-content: space-between;
        }

        .file-info span {
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        .btn-remove-file {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.15rem;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 0.35rem;
            padding: 0.65rem 1rem;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
        }

        .btn-action:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.5);
        }

        .btn-action:disabled {
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 99px;
            transition: width 0.3s ease;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: progress-shimmer 2s infinite;
        }

        @keyframes progress-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .time-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--accent);
            font-family: var(--font-mono);
            background: rgba(6, 182, 212, 0.05);
            padding: 0.3rem 0.6rem;
            border-radius: 0.35rem;
            border: 1px solid rgba(6, 182, 212, 0.15);
        }

        /* Event stream/visualization */
        .notes-visualizer {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            height: 110px;
            overflow-y: auto;
            padding: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            scroll-behavior: smooth;
        }

        .note-log {
            padding: 0.15rem 0.35rem;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 2px solid transparent;
            animation: fade-in 0.2s ease-out;
        }

        .note-log.note-on {
            border-color: var(--primary);
            color: #c7d2fe;
        }

        .note-log.note-off {
            border-color: var(--secondary);
            color: var(--text-muted);
        }

        .note-log.system {
            border-color: var(--accent);
            color: #a5f3fc;
            background: rgba(6, 182, 212, 0.05);
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Instruments selector tags */
        .instruments-selector {
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.35rem;
            padding: 0.5rem;
            background: var(--bg-card);
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .instrument-tag {
            font-size: 0.75rem;
            padding: 0.15rem 0.45rem;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .instrument-tag.selected {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 0 6px rgba(99, 102, 241, 0.2);
        }

        .result-panel {
            display: flex;
            animation: fade-in 0.5s ease;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        }

        .btn-download:hover {
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4) !important;
        }

        .audio-playback {
            width: 100%;
            background: var(--bg-card);
            border-radius: 0.35rem;
            padding: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            flex-direction: column;
            gap: 0.5rem;
        }

        audio {
            width: 100%;
            height: 32px;
        }

        .tooltip-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.7rem;
            font-weight: bold;
            cursor: help;
            margin-left: 0.2m;
            color: var(--text-muted);
        }

        /* Piano Roll Visualizer */
        .piano-roll-panel {
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
            flex: 1;
            height: 100%;
        }

        .piano-roll-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            height: 50px;
        }

        .piano-roll-header h2 {
            margin-bottom: 0;
            font-size: 1.1rem;
        }

        .piano-roll-controls {
            display: flex;
            gap: 0.35rem;
        }

        .piano-roll-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            cursor: grab;
            overflow: hidden;
            background: #08090d;
        }

        .piano-roll-wrapper:active {
            cursor: grabbing;
        }

        .track-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            padding: 0.7rem 1.5rem;
            background: rgba(0, 0, 0, 0.15);
            min-height: 40px;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .track-legend-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            margin-right: 0.25rem;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.78rem;
            color: var(--text-main);
            cursor: pointer;
            padding: 0.15rem 0.5rem;
            border-radius: 0.35rem;
            transition: all 0.15s ease;
            user-select: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .track-item.muted {
            opacity: 0.3;
        }

        .track-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .track-note-count {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
    </style>
</head>    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                MuScriptor <span class="badge">AMT</span>
            </div>
            <div class="server-status">
                <div class="status-badge">
                    <span id="gpuInfo" class="gpu-badge">GPU: Detecting...</span>
                    <div id="statusDot" class="status-dot"></div>
                    <span id="statusText">Checking...</span>
                </div>
            </div>
        </div>

        <div class="glass-panel" id="inputPanel" style="padding: 1.2rem; border-radius: 0.75rem;">
            <h2>Audio/Video Input</h2>
            
            <div class="tabs" style="margin-bottom: 1rem; padding: 0.2rem;">
                <button class="tab-btn active" id="tabLocal" style="padding: 0.4rem; font-size: 0.8rem;">Local File</button>
                <button class="tab-btn" id="tabYoutube" style="padding: 0.4rem; font-size: 0.8rem;">YouTube URL</button>
            </div>

            <div class="input-panel" style="min-height: 120px;">
                <!-- Local file dropzone -->
                <div class="dropzone" id="dropzone" style="min-height: 120px; padding: 1.5rem 1rem; border-radius: 0.75rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 32px; height: 32px;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                    </svg>
                    <div class="dropzone-text">
                        <h3 style="font-size: 0.9rem;">Drag & drop audio or video</h3>
                        <p style="font-size: 0.72rem;">MP3, WAV, FLAC, MP4, MKV...</p>
                    </div>
                    <input type="file" id="audioFile" accept="audio/*,video/*" style="display: none;">
                </div>

                <!-- YouTube Link container -->
                <div class="youtube-input-container" id="youtubeContainer" style="min-height: 120px; padding: 1.5rem 1rem; border-radius: 0.75rem; gap: 0.75rem;">
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width: 36px; height: 36px;">
                        <path d="M23.498 6.163a3.003 3.003 0 0 0-2.11-2.11C19.517 3.545 12 3.545 12 3.545s-7.517 0-9.388.508a3.003 3.003 0 0 0-2.11 2.11C0 8.033 0 12 0 12s0 3.967.502 5.837a3.003 3.003 0 0 0 2.11 2.11c1.871.508 9.388.508 9.388.508s7.517 0 9.388-.508a3.003 3.003 0 0 0 2.11-2.11C24 15.967 24 12 24 12s0-3.967-.502-5.837zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    <div style="width: 100%;">
                        <label for="ytUrl" style="font-size: 0.8rem; margin-bottom: 0.25rem;">YouTube Video URL</label>
                        <input type="text" id="ytUrl" placeholder="https://youtube.com/..." style="padding: 0.5rem 0.75rem; font-size: 0.85rem;">
                    </div>
                </div>
            </div>

            <div class="file-info" id="fileInfo" style="padding: 0.5rem 0.75rem; margin-top: 0.75rem; border-radius: 0.35rem;">
                <span id="fileName" style="font-size: 0.8rem;">No file selected</span>
                <button class="btn-remove-file" id="btnRemoveFile" style="font-size: 0.9rem;">&times;</button>
            </div>
        </div>

        <div class="glass-panel" style="padding: 1.2rem; border-radius: 0.75rem;">
            <h2>Configuration</h2>
            
            <div class="form-group" style="margin-bottom: 1rem;">
                <label style="font-size: 0.8rem; margin-bottom: 0.25rem;">
                    Model Size
                    <span class="tooltip-icon" title="Small (103M): Fast, low VRAM. Medium (307M): Good balance. Large (1.4B): Highest accuracy, transcribes dense instruments, needs more VRAM.">?</span>
                </label>
                <select id="modelSize" style="padding: 0.5rem 0.75rem; font-size: 0.85rem;">
                    <option value="large">Large (1.4B Parameters)</option>
                    <option value="medium" selected>Medium (307M Parameters)</option>
                    <option value="small">Small (103M Parameters)</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label style="font-size: 0.8rem; margin-bottom: 0.25rem;">
                    Target Instruments (Optional)
                    <span class="tooltip-icon" title="Condition the model to transcribe only these instruments. If none are selected, all detected instruments are transcribed.">?</span>
                </label>
                <div id="instrumentsList" class="instruments-selector" style="max-height: 100px; padding: 0.5rem; gap: 0.35rem;">
                    <span class="text-muted" style="font-size: 0.75rem;">Loading instruments...</span>
                </div>
            </div>

            <button id="btnTranscribe" class="btn-action" disabled style="padding: 0.65rem 1rem; font-size: 0.9rem; border-radius: 0.35rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Start Transcription
            </button>
        </div>

        <!-- Real-time Progress & Visualization -->
        <div class="glass-panel" id="progressPanel" style="display: none; flex-direction: column; gap: 1rem; padding: 1.2rem; border-radius: 0.75rem;">
            <h2>Progress Status</h2>
            
            <div class="status-container" style="gap: 0.5rem;">
                <div class="progress-stats" style="font-size: 0.8rem;">
                    <span id="transcribeStatus">Idle</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-container" style="height: 8px;">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="time-stats" id="timeStatsPanel" style="display: none; font-size: 0.75rem; padding: 0.3rem 0.6rem; border-radius: 0.35rem;">
                    <span id="elapsedTimeLabel">Elapsed: --</span>
                    <span id="etaTimeLabel">ETA: --</span>
                </div>
            </div>

            <div class="notes-visualizer" id="notesVisualizer" style="height: 110px; font-size: 0.75rem; padding: 0.5rem;">
                <div class="note-log system">Transcribing output logs...</div>
            </div>

            <!-- Transcription Result Controls -->
            <div class="result-panel" id="resultPanel" style="gap: 0.75rem; margin-top: 0.5rem;">
                <button id="btnDownloadMidi" class="btn-action btn-download" style="padding: 0.6rem 1rem; font-size: 0.85rem; border-radius: 0.35rem;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    Download MIDI
                </button>
                
                <button id="btnAuralize" class="btn-action" style="background: var(--bg-card); border: 1px solid var(--primary); padding: 0.6rem 1rem; font-size: 0.85rem; border-radius: 0.35rem;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    Synthesize Playback
                </button>

                <div class="audio-playback" id="audioPlayback" style="padding: 0.75rem; gap: 0.5rem; margin-top: 0.25rem;">
                    <label style="font-size: 0.75rem;">Synthesized Audio:</label>
                    <audio id="audioPlayer" controls style="height: 32px;"></audio>
                </div>
            </div>
        </div>
    </aside>

    <main class="workspace">
        <!-- Piano Roll Visualizer Section (Full Width/Height of remaining space) -->
        <div class="piano-roll-panel" id="pianoRollPanel">
            <div class="piano-roll-header">
                <h2>Piano Roll</h2>
                <div class="piano-roll-controls">
                    <button class="pr-btn" id="btnPrZoomIn" title="Zoom In">+</button>
                    <button class="pr-btn" id="btnPrZoomOut" title="Zoom Out">&minus;</button>
                    <button class="pr-btn wide" id="btnPrFitAll" title="Fit All Notes">Fit</button>
                    <button class="pr-btn wide active" id="btnPrFollow" title="Auto-follow latest notes">Following</button>
                </div>
            </div>
            <div class="piano-roll-wrapper" id="pianoRollWrapper">
                <canvas id="pianoRollCanvas"></canvas>
            </div>
            <div class="track-legend" id="trackLegend">
                <span class="track-legend-title">Detected Tracks</span>
            </div>
        </div>
    </main>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const gpuInfo = document.getElementById('gpuInfo');
        const modelSizeSelect = document.getElementById('modelSize');
        const instrumentsList = document.getElementById('instrumentsList');
        const btnTranscribe = document.getElementById('btnTranscribe');
        
        const tabLocal = document.getElementById('tabLocal');
        const tabYoutube = document.getElementById('tabYoutube');
        const dropzone = document.getElementById('dropzone');
        const youtubeContainer = document.getElementById('youtubeContainer');
        const ytUrlInput = document.getElementById('ytUrl');

        const audioFileInput = document.getElementById('audioFile');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const btnRemoveFile = document.getElementById('btnRemoveFile');
        
        const progressPanel = document.getElementById('progressPanel');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const transcribeStatus = document.getElementById('transcribeStatus');
        
        const timeStatsPanel = document.getElementById('timeStatsPanel');
        const elapsedTimeLabel = document.getElementById('elapsedTimeLabel');
        const etaTimeLabel = document.getElementById('etaTimeLabel');

        const notesVisualizer = document.getElementById('notesVisualizer');
        const resultPanel = document.getElementById('resultPanel');
        const btnDownloadMidi = document.getElementById('btnDownloadMidi');
        const btnAuralize = document.getElementById('btnAuralize');
        const audioPlayback = document.getElementById('audioPlayback');
        const audioPlayer = document.getElementById('audioPlayer');

        // Piano Roll elements
        const pianoRollPanel = document.getElementById('pianoRollPanel');
        const pianoRollCanvas = document.getElementById('pianoRollCanvas');
        const pianoRollWrapper = document.getElementById('pianoRollWrapper');
        const trackLegend = document.getElementById('trackLegend');
        const btnPrZoomIn = document.getElementById('btnPrZoomIn');
        const btnPrZoomOut = document.getElementById('btnPrZoomOut');
        const btnPrFitAll = document.getElementById('btnPrFitAll');
        const btnPrFollow = document.getElementById('btnPrFollow');
        const prCtx = pianoRollCanvas.getContext('2d');

        let inputMode = 'local'; // 'local' or 'youtube'
        let selectedFile = null;
        let selectedInstruments = new Set();
        let generatedMidiBase64 = null;
        let generatedMidiBytes = null;

        // Timing variables for ETA
        let startTime = null;
        let timeInterval = null;

        // Piano Roll state
        let pianoRollNotes = [];
        let notesByIndex = {};
        let instrumentColorMap = {};
        let instrumentNoteCounts = {};
        let trackVisibility = {};
        let prColorIdx = 0;
        let prViewStart = 0;
        let prViewEnd = 15;
        let prFollowing = true;
        let prDragging = false;
        let prDragStartX = 0;
        let prDragViewStart = 0;
        let prDetectedMinPitch = 127;
        let prDetectedMaxPitch = 0;
        let prRenderQueued = false;
        let activeSynthPitch = null;
        let audioCtx = null;

        const TRACK_COLORS = [
            '#f6c344', '#e84393', '#00cec9', '#fd79a8', '#00b894',
            '#74b9ff', '#6c5ce7', '#a29bfe', '#fab1a0', '#55efc4',
            '#ff7675', '#0984e3', '#e17055', '#81ecec', '#dfe6e9', '#b2bec3'
        ];
        const PR_LEFT = 50;
        const PR_TOP = 24;
        const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const BLACK_KEYS = new Set([1, 3, 6, 8, 10]);

        // Play Synth Tone via AudioContext
        function playSynthNote(pitch) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const freq = 440 * Math.pow(2, (pitch - 69) / 12);
                
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'triangle'; // Clean round sound
                osc.frequency.value = freq;
                
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);

                // Highlight key
                activeSynthPitch = pitch;
                queuePianoRollRender();
                setTimeout(() => {
                    activeSynthPitch = null;
                    queuePianoRollRender();
                }, 150);
            } catch (e) {
                console.error("Synth playback failed:", e);
            }
        }

        // Check backend server status, GPU info and load instruments on load
        async function checkServer() {
            try {
                const response = await fetch('/health');
                if (response.ok) {
                    const data = await response.json();
                    statusDot.className = 'status-dot online';
                    statusText.textContent = 'Server Online';
                    
                    if (data.gpu) {
                        gpuInfo.textContent = `GPU: ${data.gpu}`;
                    } else {
                        gpuInfo.textContent = 'GPU: None (CPU)';
                    }
                    loadInstruments();
                } else {
                    throw new Error('Not OK');
                }
            } catch (e) {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Server Offline';
                gpuInfo.textContent = 'GPU: Disconnected';
                console.error("Server health check failed:", e);
            }
        }

        async function loadInstruments() {
            try {
                const response = await fetch('/instruments');
                if (response.ok) {
                    const data = await response.json();
                    instrumentsList.innerHTML = '';
                    data.instruments.forEach(inst => {
                        const tag = document.createElement('span');
                        tag.className = 'instrument-tag';
                        tag.textContent = inst;
                        tag.addEventListener('click', () => {
                            if (selectedInstruments.has(inst)) {
                                selectedInstruments.delete(inst);
                                tag.classList.remove('selected');
                            } else {
                                selectedInstruments.add(inst);
                                tag.classList.add('selected');
                            }
                        });
                        instrumentsList.appendChild(tag);
                    });
                }
            } catch (e) {
                console.error("Failed to load instruments:", e);
                instrumentsList.innerHTML = '<span class="text-muted">Error loading instruments.</span>';
            }
        }

        checkServer();
        // Poll server status every 10 seconds
        setInterval(checkServer, 10000);

        // Tab Switching
        tabLocal.addEventListener('click', () => {
            inputMode = 'local';
            tabLocal.classList.add('active');
            tabYoutube.classList.remove('active');
            dropzone.style.display = 'flex';
            youtubeContainer.style.display = 'none';
            checkInputs();
        });

        tabYoutube.addEventListener('click', () => {
            inputMode = 'youtube';
            tabYoutube.classList.add('active');
            tabLocal.classList.remove('active');
            youtubeContainer.style.display = 'flex';
            dropzone.style.display = 'none';
            checkInputs();
        });

        ytUrlInput.addEventListener('input', checkInputs);

        function checkInputs() {
            if (inputMode === 'local') {
                btnTranscribe.disabled = !selectedFile;
            } else {
                const url = ytUrlInput.value.trim();
                btnTranscribe.disabled = !url.startsWith('http://') && !url.startsWith('https://');
            }
        }

        // Dropzone & File logic
        dropzone.addEventListener('click', () => audioFileInput.click());
        
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        audioFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            fileInfo.style.display = 'flex';
            dropzone.style.display = 'none';
            checkInputs();
        }

        btnRemoveFile.addEventListener('click', () => {
            selectedFile = null;
            audioFileInput.value = '';
            fileInfo.style.display = 'none';
            dropzone.style.display = 'flex';
            checkInputs();
        });

        // Add Log to visualizer panel
        function addLog(text, className = '') {
            const log = document.createElement('div');
            log.className = `note-log ${className}`;
            log.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            notesVisualizer.appendChild(log);
            
            // Auto scroll to bottom
            notesVisualizer.scrollTop = notesVisualizer.scrollHeight;
            
            // Limit log count to 150 elements to avoid slowing down rendering
            if (notesVisualizer.children.length > 150) {
                notesVisualizer.removeChild(notesVisualizer.firstChild);
            }
        }

        function formatTime(seconds) {
            if (seconds === Infinity || isNaN(seconds) || seconds < 0) return "--";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}m ${s}s`;
        }

        function updateElapsedStats() {
            if (!startTime) return;
            const elapsed = (Date.now() - startTime) / 1000;
            elapsedTimeLabel.textContent = `Elapsed: ${formatTime(elapsed)}`;
        }

        // Action: Transcribe
        btnTranscribe.addEventListener('click', async () => {
            // Reset UI
            progressPanel.style.display = 'flex';
            resultPanel.style.display = 'none';
            audioPlayback.style.display = 'none';
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            transcribeStatus.textContent = 'Starting processing run...';
            notesVisualizer.innerHTML = '';

            // Reset Piano Roll
            pianoRollNotes = [];
            notesByIndex = {};
            instrumentColorMap = {};
            instrumentNoteCounts = {};
            trackVisibility = {};
            prColorIdx = 0;
            prViewStart = 0;
            prViewEnd = 15;
            prDetectedMinPitch = 127;
            prDetectedMaxPitch = 0;
            prFollowing = true;
            btnPrFollow.classList.add('active');
            btnPrFollow.textContent = 'Following';
            pianoRollPanel.classList.add('active');
            trackLegend.innerHTML = '<span class="track-legend-title">Detected Tracks</span>';
            queuePianoRollRender();

            btnTranscribe.disabled = true;
            btnRemoveFile.disabled = true;
            ytUrlInput.disabled = true;
            generatedMidiBase64 = null;
            generatedMidiBytes = null;

            // Timer setup
            startTime = Date.now();
            timeStatsPanel.style.display = 'flex';
            elapsedTimeLabel.textContent = "Elapsed: 0s";
            etaTimeLabel.textContent = "ETA: Calculating...";
            clearInterval(timeInterval);
            timeInterval = setInterval(updateElapsedStats, 1000);

            let response;
            try {
                if (inputMode === 'local') {
                    addLog("Uploading local file and initializing model...", "system");
                    const formData = new FormData();
                    formData.append('file', selectedFile);
                    formData.append('model_size', modelSizeSelect.value);
                    selectedInstruments.forEach(inst => {
                        formData.append('instruments', inst);
                    });

                    response = await fetch('/transcribe', {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    const ytUrl = ytUrlInput.value.trim();
                    addLog(`Requesting YouTube download and transcription for: ${ytUrl}`, "system");
                    
                    const formData = new FormData();
                    formData.append('url', ytUrl);
                    formData.append('model_size', modelSizeSelect.value);
                    selectedInstruments.forEach(inst => {
                        formData.append('instruments', inst);
                    });

                    response = await fetch('/transcribe_youtube', {
                        method: 'POST',
                        body: formData
                    });
                }

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || `Server responded with status ${response.status}`);
                }

                transcribeStatus.textContent = 'Processing...';
                
                // Read the Stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop(); // Keep the partial line in buffer

                    for (const line of lines) {
                        const cleanLine = line.trim();
                        if (cleanLine.startsWith("data: ")) {
                            try {
                                const event = JSON.parse(cleanLine.slice(6));
                                handleServerEvent(event);
                            } catch (e) {
                                console.error("Error parsing event line:", cleanLine, e);
                            }
                        }
                    }
                }
            } catch (e) {
                console.error("Transcription failed:", e);
                transcribeStatus.textContent = 'Failed';
                addLog(`Error: ${e.message}`, "note-on");
                clearInterval(timeInterval);
            } finally {
                btnTranscribe.disabled = false;
                btnRemoveFile.disabled = false;
                ytUrlInput.disabled = false;
                checkInputs();
            }
        });

        // Event parser
        function handleServerEvent(event) {
            if (event.type === 'progress') {
                const percent = Math.round((event.completed / event.total) * 100);
                progressBar.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
                transcribeStatus.textContent = `Processing chunk ${event.completed} of ${event.total}`;

                // Calculate ETA
                if (startTime && event.completed > 0) {
                    const elapsed = (Date.now() - startTime) / 1000;
                    const rate = event.completed / event.total;
                    const totalEstimated = elapsed / rate;
                    const remaining = totalEstimated - elapsed;
                    etaTimeLabel.textContent = `ETA: ${formatTime(remaining)}`;
                }
            } 
            else if (event.type === 'start') {
                const instrName = event.instrument || 'Unknown';
                addLog(`NOTE ON: Pitch ${event.pitch}, Time ${event.start_time.toFixed(2)}s, Instrument: ${instrName}`, "note-on");

                // Piano Roll: record note
                const note = {
                    pitch: event.pitch,
                    startTime: event.start_time,
                    endTime: null,
                    instrument: instrName,
                    index: event.index
                };
                pianoRollNotes.push(note);
                notesByIndex[event.index] = note;

                // Track instrument color
                if (!instrumentColorMap[instrName]) {
                    instrumentColorMap[instrName] = TRACK_COLORS[prColorIdx % TRACK_COLORS.length];
                    prColorIdx++;
                    trackVisibility[instrName] = true;
                    instrumentNoteCounts[instrName] = 0;
                }
                instrumentNoteCounts[instrName]++;

                // Update pitch range
                if (event.pitch < prDetectedMinPitch) prDetectedMinPitch = event.pitch;
                if (event.pitch > prDetectedMaxPitch) prDetectedMaxPitch = event.pitch;

                // Auto-follow: scroll viewport to keep latest notes visible
                if (prFollowing && event.start_time > prViewEnd - 2) {
                    const viewSpan = prViewEnd - prViewStart;
                    prViewEnd = event.start_time + viewSpan * 0.2;
                    prViewStart = prViewEnd - viewSpan;
                }

                queuePianoRollRender();
            } 
            else if (event.type === 'end') {
                addLog(`NOTE OFF: Index ${event.start_event_index} (at ${event.end_time.toFixed(2)}s)`, "note-off");

                // Piano Roll: close note
                const note = notesByIndex[event.start_event_index];
                if (note) {
                    note.endTime = event.end_time;
                }
                queuePianoRollRender();
            } 
            else if (event.type === 'status_update') {
                // Custom status reports from YouTube download etc
                addLog(event.message, "system");
            }
            else if (event.type === 'midi') {
                clearInterval(timeInterval);
                const elapsed = (Date.now() - startTime) / 1000;
                elapsedTimeLabel.textContent = `Elapsed: ${formatTime(elapsed)}`;
                etaTimeLabel.textContent = "Finished!";
                
                progressBar.style.width = `100%`;
                progressPercent.textContent = `100%`;
                transcribeStatus.textContent = `Complete`;
                addLog("Received MIDI file payload!", "system");
                
                generatedMidiBase64 = event.data;
                // Convert base64 to binary bytes
                const binaryStr = atob(event.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }
                generatedMidiBytes = bytes;

                resultPanel.style.display = 'flex';

                // Fit the piano roll to show all notes
                fitPianoRoll();
            }
        }

        // Action: Download MIDI
        btnDownloadMidi.addEventListener('click', () => {
            if (!generatedMidiBytes) return;
            
            const blob = new Blob([generatedMidiBytes], { type: 'audio/midi' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            // Clean original filename and append .mid
            let outputName = 'transcription';
            if (inputMode === 'local' && selectedFile) {
                outputName = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.'));
            } else if (inputMode === 'youtube') {
                outputName = 'youtube_transcription';
            }
            
            a.download = `${outputName}.mid`;
            a.href = url;
            a.click();
            
            // Clean up
            setTimeout(() => URL.revokeObjectURL(url), 100);
        });

        // Action: Auralize (Synthesize MIDI back to WAV audio)
        btnAuralize.addEventListener('click', async () => {
            if (!generatedMidiBytes) return;

            addLog("Synthesizing transcribed MIDI into WAV audio...", "system");
            btnAuralize.disabled = true;

            try {
                // Convert MIDI bytes back to a file
                const midiBlob = new Blob([generatedMidiBytes], { type: 'audio/midi' });
                const formData = new FormData();
                formData.append('midi', midiBlob, 'transcription.mid');
                formData.append('mode', 'synth'); // synthesis only

                const response = await fetch('/auralize', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Synthesis server error: ${response.status}`);
                }

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                
                audioPlayer.src = audioUrl;
                audioPlayback.style.display = 'flex';
                audioPlayer.play();
                
                addLog("Synthesis complete! Loading player...", "system");
            } catch (e) {
                console.error("Auralization failed:", e);
                addLog(`Synthesis failed: ${e.message}`, "note-on");
            } finally {
                btnAuralize.disabled = false;
            }
        });

        // =================== PIANO ROLL RENDERER ===================

        function queuePianoRollRender() {
            if (!prRenderQueued) {
                prRenderQueued = true;
                requestAnimationFrame(() => {
                    prRenderQueued = false;
                    renderPianoRoll();
                    updateTrackLegend();
                });
            }
        }

        function midiNoteName(pitch) {
            const name = NOTE_NAMES[pitch % 12];
            const octave = Math.floor(pitch / 12) - 1;
            return `${name}${octave}`;
        }

        function isBlackKey(pitch) {
            return BLACK_KEYS.has(pitch % 12);
        }

        function renderPianoRoll() {
            const dpr = window.devicePixelRatio || 1;
            const rect = pianoRollWrapper.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            if (w === 0 || h === 0) return;

            pianoRollCanvas.width = w * dpr;
            pianoRollCanvas.height = h * dpr;
            prCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const ctx = prCtx;

            // Pitch range: default to C3-C6 (48-84) if no notes yet
            let pitchMin = 48;
            let pitchMax = 84;
            if (pianoRollNotes.length > 0) {
                pitchMin = Math.max(0, prDetectedMinPitch - 3);
                pitchMax = Math.min(127, prDetectedMaxPitch + 3);
            }
            const pitchRange = Math.max(pitchMax - pitchMin + 1, 12);

            const drawW = w - PR_LEFT;
            const drawH = h - PR_TOP;
            const pxPerPitch = drawH / pitchRange;
            const timeSpan = prViewEnd - prViewStart;
            const pxPerSec = drawW / timeSpan;

            // Background
            ctx.fillStyle = '#08090d';
            ctx.fillRect(0, 0, w, h);

            // Draw pitch rows grid
            for (let p = pitchMin; p <= pitchMax; p++) {
                const y = PR_TOP + (pitchMax - p) * pxPerPitch;
                ctx.fillStyle = isBlackKey(p) ? 'rgba(255,255,255,0.015)' : 'rgba(255,255,255,0.03)';
                ctx.fillRect(PR_LEFT, y, drawW, pxPerPitch);

                // Row grid line
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(PR_LEFT, y);
                ctx.lineTo(w, y);
                ctx.stroke();

                // Highlight C notes
                if (p % 12 === 0) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(PR_LEFT, y + pxPerPitch);
                    ctx.lineTo(w, y + pxPerPitch);
                    ctx.stroke();
                }
            }

            // Time grid lines
            const timeStep = getTimeGridStep(timeSpan, drawW);
            const firstTick = Math.ceil(prViewStart / timeStep) * timeStep;
            for (let t = firstTick; t <= prViewEnd; t += timeStep) {
                const x = PR_LEFT + (t - prViewStart) * pxPerSec;
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(x, PR_TOP);
                ctx.lineTo(x, h);
                ctx.stroke();
            }

            // Draw notes
            const cornerR = Math.min(3, pxPerPitch / 3);
            for (const note of pianoRollNotes) {
                if (!trackVisibility[note.instrument]) continue;
                if (note.pitch < pitchMin || note.pitch > pitchMax) continue;
                const noteEnd = note.endTime !== null ? note.endTime : (prViewEnd + 0.5);
                if (noteEnd < prViewStart || note.startTime > prViewEnd) continue;

                const x = PR_LEFT + (note.startTime - prViewStart) * pxPerSec;
                const xEnd = PR_LEFT + (noteEnd - prViewStart) * pxPerSec;
                
                const startX = Math.max(x, PR_LEFT);
                const endX = Math.max(xEnd, PR_LEFT);
                const noteW = endX - startX;
                if (noteW <= 0) continue;

                const y = PR_TOP + (pitchMax - note.pitch) * pxPerPitch + 1;
                const noteH = pxPerPitch - 2;
                const color = instrumentColorMap[note.instrument] || '#6366f1';

                ctx.fillStyle = color;
                ctx.globalAlpha = 0.85;
                prRoundRect(ctx, startX, y, noteW, Math.max(noteH, 2), cornerR);
                ctx.fill();

                // Subtle top highlight
                ctx.globalAlpha = 0.25;
                ctx.fillStyle = '#ffffff';
                prRoundRect(ctx, startX, y, noteW, Math.max(noteH / 3, 1), cornerR);
                ctx.fill();
                ctx.globalAlpha = 1;

                // Open note pulsing edge
                if (note.endTime === null) {
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(Date.now() / 200);
                    ctx.fillRect(endX - 3, y, 3, Math.max(noteH, 2));
                    ctx.globalAlpha = 1;
                }
            }

            // Draw Piano Keyboard Keys on the Left (over the note grid)
            const keyboardW = PR_LEFT;
            for (let p = pitchMin; p <= pitchMax; p++) {
                const y = PR_TOP + (pitchMax - p) * pxPerPitch;
                const isBlack = isBlackKey(p);
                const isActive = (p === activeSynthPitch);
                
                if (isBlack) {
                    // Black keys (shorter, dark color)
                    ctx.fillStyle = isActive ? 'rgba(99, 102, 241, 0.6)' : '#1e1f29';
                    ctx.fillRect(0, y, keyboardW - 16, pxPerPitch);
                    
                    ctx.strokeStyle = '#3a3d52';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(0, y, keyboardW - 16, pxPerPitch);
                } else {
                    // White keys (full width, light color)
                    ctx.fillStyle = isActive ? 'rgba(99, 102, 241, 0.4)' : '#f3f4f6';
                    ctx.fillRect(0, y, keyboardW, pxPerPitch);
                    
                    ctx.strokeStyle = '#d1d5db';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(0, y, keyboardW, pxPerPitch);
                    
                    // Show note name on C keys
                    if (p % 12 === 0) {
                        ctx.fillStyle = '#4b5563';
                        ctx.font = 'bold 9px var(--font-main)';
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(midiNoteName(p), keyboardW - 5, y + pxPerPitch / 2);
                    }
                }
            }

            // Draw Y-axis border separating keyboard from grid
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(PR_LEFT, 0);
            ctx.lineTo(PR_LEFT, h);
            ctx.stroke();

            // Draw Top Timeline Ruler Bar
            ctx.fillStyle = '#0d0e14';
            ctx.fillRect(PR_LEFT, 0, w - PR_LEFT, PR_TOP);
            
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.font = '10px "JetBrains Mono", monospace';
            for (let t = firstTick; t <= prViewEnd; t += timeStep) {
                const x = PR_LEFT + (t - prViewStart) * pxPerSec;
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, PR_TOP);
                ctx.stroke();
                
                ctx.fillStyle = '#6b7280';
                const mins = Math.floor(t / 60);
                const secs = Math.floor(t % 60);
                ctx.fillText(mins > 0 ? `${mins}:${secs.toString().padStart(2,'0')}` : `${secs}s`, x, 6);
            }

            // Draw X-axis border separating timeline from grid
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, PR_TOP);
            ctx.lineTo(w, PR_TOP);
            ctx.stroke();

            // Draw top-left empty corner junction block
            ctx.fillStyle = '#0a0b10';
            ctx.fillRect(0, 0, PR_LEFT, PR_TOP);
        }

        function prRoundRect(ctx, x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            if (r < 0.5) { ctx.beginPath(); ctx.rect(x, y, w, h); ctx.closePath(); return; }
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
        }

        function getTimeGridStep(timeSpan, width) {
            const targetPx = 80;
            const rawStep = timeSpan * targetPx / width;
            const steps = [0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60];
            for (const s of steps) { if (s >= rawStep) return s; }
            return 60;
        }

        function updateTrackLegend() {
            trackLegend.innerHTML = '<span class="track-legend-title">Detected Tracks</span>';
            for (const [inst, color] of Object.entries(instrumentColorMap)) {
                const count = instrumentNoteCounts[inst] || 0;
                const item = document.createElement('div');
                item.className = `track-item${trackVisibility[inst] ? '' : ' muted'}`;
                item.innerHTML = `<span class="track-color-dot" style="background:${color}"></span><span>${inst}</span><span class="track-note-count">${count}</span>`;
                item.addEventListener('click', () => {
                    trackVisibility[inst] = !trackVisibility[inst];
                    item.classList.toggle('muted');
                    queuePianoRollRender();
                });
                trackLegend.appendChild(item);
            }
        }

        function fitPianoRoll() {
            if (pianoRollNotes.length === 0) return;
            let maxTime = 0;
            for (const n of pianoRollNotes) {
                const t = n.endTime || n.startTime;
                if (t > maxTime) maxTime = t;
            }
            prViewStart = 0;
            prViewEnd = Math.max(maxTime + 1, 5);
            queuePianoRollRender();
        }

        // Piano Roll interaction: drag to pan OR click keyboard key
        pianoRollWrapper.addEventListener('mousedown', (e) => {
            const rect = pianoRollCanvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (mouseX <= PR_LEFT && mouseY > PR_TOP) {
                // Clicked on the piano keyboard keys!
                const drawH = rect.height - PR_TOP;
                // Pitch range: default to C3-C6 (48-84) if no notes yet
                let pitchMin = 48;
                let pitchMax = 84;
                if (pianoRollNotes.length > 0) {
                    pitchMin = Math.max(0, prDetectedMinPitch - 3);
                    pitchMax = Math.min(127, prDetectedMaxPitch + 3);
                }
                const pitchRange = Math.max(pitchMax - pitchMin + 1, 12);
                const pxPerPitch = drawH / pitchRange;
                
                const clickedPitch = pitchMax - Math.floor((mouseY - PR_TOP) / pxPerPitch);
                if (clickedPitch >= 0 && clickedPitch <= 127) {
                    playSynthNote(clickedPitch);
                }
            } else {
                // Standard panning drag logic
                prDragging = true;
                prDragStartX = e.clientX;
                prDragViewStart = prViewStart;
                prFollowing = false;
                btnPrFollow.classList.remove('active');
                btnPrFollow.textContent = 'Follow';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!prDragging) return;
            const rect = pianoRollWrapper.getBoundingClientRect();
            const drawW = rect.width - PR_LEFT;
            const timeSpan = prViewEnd - prViewStart;
            const dx = e.clientX - prDragStartX;
            const timeDelta = -(dx / drawW) * timeSpan;
            prViewStart = Math.max(0, prDragViewStart + timeDelta);
            prViewEnd = prViewStart + timeSpan;
            queuePianoRollRender();
        });

        window.addEventListener('mouseup', () => { prDragging = false; });

        // Wheel to zoom
        pianoRollWrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = pianoRollWrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const drawW = rect.width - PR_LEFT;
            const timeSpan = prViewEnd - prViewStart;
            const mouseTime = prViewStart + ((mouseX - PR_LEFT) / drawW) * timeSpan;
            const zoomFactor = e.deltaY > 0 ? 1.15 : 0.87;
            const newSpan = Math.max(1, Math.min(600, timeSpan * zoomFactor));
            const ratio = (mouseX - PR_LEFT) / drawW;
            prViewStart = Math.max(0, mouseTime - newSpan * ratio);
            prViewEnd = prViewStart + newSpan;
            prFollowing = false;
            btnPrFollow.classList.remove('active');
            btnPrFollow.textContent = 'Follow';
            queuePianoRollRender();
        }, { passive: false });

        // Toolbar buttons
        btnPrZoomIn.addEventListener('click', () => {
            const center = (prViewStart + prViewEnd) / 2;
            const span = (prViewEnd - prViewStart) * 0.7;
            prViewStart = Math.max(0, center - span / 2);
            prViewEnd = prViewStart + span;
            queuePianoRollRender();
        });

        btnPrZoomOut.addEventListener('click', () => {
            const center = (prViewStart + prViewEnd) / 2;
            const span = Math.min(600, (prViewEnd - prViewStart) * 1.4);
            prViewStart = Math.max(0, center - span / 2);
            prViewEnd = prViewStart + span;
            queuePianoRollRender();
        });

        btnPrFitAll.addEventListener('click', () => { fitPianoRoll(); });

        btnPrFollow.addEventListener('click', () => {
            prFollowing = !prFollowing;
            btnPrFollow.classList.toggle('active');
            btnPrFollow.textContent = prFollowing ? 'Following' : 'Follow';
        });

        // Resize handler
        window.addEventListener('resize', () => queuePianoRollRender());

        // Queue initial render on load to draw empty keyboard and grid
        queuePianoRollRender();

    </script>
</body>
</html>
