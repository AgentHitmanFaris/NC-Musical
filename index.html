<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuScriptor GUI — AI Music Transcription</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0b10;
            --bg-surface: rgba(20, 22, 32, 0.7);
            --bg-card: rgba(30, 32, 47, 0.4);
            --border-glow: rgba(99, 102, 241, 0.25);
            --border-hover: rgba(99, 102, 241, 0.5);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a855f7;
            --accent: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 1200px;
            padding: 2.5rem 1.5rem 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary) 70%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span.badge {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.2rem 0.5rem;
            border-radius: 99px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--primary);
            color: var(--text-main);
            -webkit-text-fill-color: var(--text-main);
        }

        .server-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: var(--bg-surface);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .status-dot.online {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        main {
            width: 100%;
            max-width: 1200px;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            flex-grow: 1;
        }

        @media (min-width: 1024px) {
            main {
                grid-template-columns: 380px 1fr;
            }
        }

        .glass-panel {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 1.25rem;
            padding: 1.8rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            border-color: var(--border-hover);
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            border-left: 4px solid var(--primary);
            padding-left: 0.75rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        select, input[type="text"] {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            color: var(--text-main);
            padding: 0.75rem 1rem;
            font-family: var(--font-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--primary);
        }

        /* Dropzone Styling */
        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 3rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            min-height: 250px;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
        }

        .dropzone svg {
            width: 48px;
            height: 48px;
            color: var(--primary);
            transition: transform 0.3s ease;
        }

        .dropzone:hover svg {
            transform: translateY(-5px);
        }

        .dropzone-text h3 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .dropzone-text p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .file-info {
            display: none;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            margin-top: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .file-info span {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        .btn-remove-file {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.25rem;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.85rem 1.5rem;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-action:disabled {
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Transcription progress & result panels */
        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 99px;
            transition: width 0.3s ease;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: progress-shimmer 2s infinite;
        }

        @keyframes progress-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Event stream/visualization */
        .notes-visualizer {
            flex-grow: 1;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
            height: 350px;
            overflow-y: auto;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column-reverse;
            gap: 0.25rem;
        }

        .note-log {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid transparent;
            animation: fade-in 0.3s ease-out;
        }

        .note-log.note-on {
            border-color: var(--primary);
            color: #c7d2fe;
        }

        .note-log.note-off {
            border-color: var(--secondary);
            color: var(--text-muted);
        }

        .note-log.system {
            border-color: var(--accent);
            color: #a5f3fc;
            background: rgba(6, 182, 212, 0.05);
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Instruments selector tags */
        .instruments-selector {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            padding: 0.75rem;
            background: var(--bg-card);
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .instrument-tag {
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .instrument-tag.selected {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.2);
        }

        .result-panel {
            display: none;
            animation: fade-in 0.5s ease;
            flex-direction: column;
            gap: 1.5rem;
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-download:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5) !important;
        }

        .audio-playback {
            margin-top: 1rem;
            width: 100%;
            background: var(--bg-card);
            border-radius: 0.5rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            flex-direction: column;
            gap: 0.75rem;
        }

        audio {
            width: 100%;
        }

        /* Tooltips */
        .tooltip-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            font-weight: bold;
            cursor: help;
            margin-left: 0.25rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            MuScriptor <span class="badge">AMT</span>
        </div>
        <div class="server-status">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Checking server...</span>
        </div>
    </header>

    <main>
        <!-- Sidebar Controls -->
        <section class="glass-panel" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <h2>Configuration</h2>
            
            <div class="form-group">
                <label>
                    Model Size
                    <span class="tooltip-icon" title="Small (103M): Fast, low VRAM. Medium (307M): Good balance. Large (1.4B): Highest accuracy, transcribes dense instruments, needs more VRAM.">?</span>
                </label>
                <select id="modelSize">
                    <option value="large" selected>Large (1.4B Parameters)</option>
                    <option value="medium">Medium (307M Parameters)</option>
                    <option value="small">Small (103M Parameters)</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    Target Instruments (Optional)
                    <span class="tooltip-icon" title="Condition the model to transcribe only these instruments. If none are selected, all detected instruments are transcribed.">?</span>
                </label>
                <div id="instrumentsList" class="instruments-selector">
                    <!-- Loaded dynamically -->
                    <span class="text-muted" style="font-size: 0.85rem;">Loading instruments...</span>
                </div>
            </div>

            <div class="form-group" style="margin-top: auto; margin-bottom: 0;">
                <button id="btnTranscribe" class="btn-action" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    Start Transcription
                </button>
            </div>
        </section>

        <!-- Main Dashboard -->
        <section class="main-panel">
            <!-- Upload Dropzone -->
            <div class="glass-panel" id="dropzonePanel">
                <h2>Audio Input</h2>
                <div class="dropzone" id="dropzone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                    </svg>
                    <div class="dropzone-text">
                        <h3>Drag & drop audio or video file here</h3>
                        <p>Supports MP3, WAV, FLAC, M4A, OGG, MP4, MKV, MOV, AVI</p>
                    </div>
                    <input type="file" id="audioFile" accept="audio/*,video/*" style="display: none;">
                </div>
                <div class="file-info" id="fileInfo">
                    <span id="fileName">No file selected</span>
                    <button class="btn-remove-file" id="btnRemoveFile">&times;</button>
                </div>
            </div>

            <!-- Real-time Progress & Visualization -->
            <div class="glass-panel" id="progressPanel" style="display: none; flex-direction: column; gap: 1.5rem; flex-grow: 1;">
                <h2>Transcription Stream</h2>
                
                <div class="status-container">
                    <div class="progress-stats">
                        <span id="transcribeStatus">Idle</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>

                <div class="notes-visualizer" id="notesVisualizer">
                    <div class="note-log system">Stream visualization logs will appear here during transcription...</div>
                </div>

                <!-- Transcription Result Controls -->
                <div class="result-panel" id="resultPanel">
                    <button id="btnDownloadMidi" class="btn-action btn-download">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        Download Transcribed MIDI
                    </button>
                    
                    <button id="btnAuralize" class="btn-action" style="background: var(--bg-card); border: 1px solid var(--primary);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        Synthesize Audio (Listen)
                    </button>

                    <div class="audio-playback" id="audioPlayback">
                        <label>Synthesized Playback:</label>
                        <audio id="audioPlayer" controls></audio>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const modelSizeSelect = document.getElementById('modelSize');
        const instrumentsList = document.getElementById('instrumentsList');
        const btnTranscribe = document.getElementById('btnTranscribe');
        const dropzone = document.getElementById('dropzone');
        const audioFileInput = document.getElementById('audioFile');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const btnRemoveFile = document.getElementById('btnRemoveFile');
        const progressPanel = document.getElementById('progressPanel');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const transcribeStatus = document.getElementById('transcribeStatus');
        const notesVisualizer = document.getElementById('notesVisualizer');
        const resultPanel = document.getElementById('resultPanel');
        const btnDownloadMidi = document.getElementById('btnDownloadMidi');
        const btnAuralize = document.getElementById('btnAuralize');
        const audioPlayback = document.getElementById('audioPlayback');
        const audioPlayer = document.getElementById('audioPlayer');

        let selectedFile = null;
        let selectedInstruments = new Set();
        let generatedMidiBase64 = null;
        let generatedMidiBytes = null;

        // Check backend server status and load instruments on load
        async function checkServer() {
            try {
                const response = await fetch('/health');
                if (response.ok) {
                    statusDot.className = 'status-dot online';
                    statusText.textContent = 'Server Online';
                    loadInstruments();
                } else {
                    throw new Error('Not OK');
                }
            } catch (e) {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Server Offline';
                console.error("Server health check failed:", e);
            }
        }

        async function loadInstruments() {
            try {
                const response = await fetch('/instruments');
                if (response.ok) {
                    const data = await response.json();
                    instrumentsList.innerHTML = '';
                    data.instruments.forEach(inst => {
                        const tag = document.createElement('span');
                        tag.className = 'instrument-tag';
                        tag.textContent = inst;
                        tag.addEventListener('click', () => {
                            if (selectedInstruments.has(inst)) {
                                selectedInstruments.delete(inst);
                                tag.classList.remove('selected');
                            } else {
                                selectedInstruments.add(inst);
                                tag.classList.add('selected');
                            }
                        });
                        instrumentsList.appendChild(tag);
                    });
                }
            } catch (e) {
                console.error("Failed to load instruments:", e);
                instrumentsList.innerHTML = '<span class="text-muted">Error loading instruments.</span>';
            }
        }

        checkServer();
        // Poll server status every 10 seconds
        setInterval(checkServer, 10000);

        // Dropzone & File logic
        dropzone.addEventListener('click', () => audioFileInput.click());
        
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        audioFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            fileInfo.style.display = 'flex';
            dropzone.style.display = 'none';
            btnTranscribe.disabled = false;
        }

        btnRemoveFile.addEventListener('click', () => {
            selectedFile = null;
            audioFileInput.value = '';
            fileInfo.style.display = 'none';
            dropzone.style.display = 'flex';
            btnTranscribe.disabled = true;
        });

        // Add Log to visualizer panel
        function addLog(text, className = '') {
            const log = document.createElement('div');
            log.className = `note-log ${className}`;
            log.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            notesVisualizer.appendChild(log);
            
            // Limit log count to 100 elements to avoid slowing down rendering
            if (notesVisualizer.children.length > 100) {
                notesVisualizer.removeChild(notesVisualizer.firstChild);
            }
        }

        // Action: Transcribe
        btnTranscribe.addEventListener('click', async () => {
            if (!selectedFile) return;

            // Reset UI
            progressPanel.style.display = 'flex';
            resultPanel.style.display = 'none';
            audioPlayback.style.display = 'none';
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            transcribeStatus.textContent = 'Starting server run...';
            notesVisualizer.innerHTML = '';
            btnTranscribe.disabled = true;
            btnRemoveFile.disabled = true;
            generatedMidiBase64 = null;
            generatedMidiBytes = null;

            addLog("Uploading audio file and initializing model...", "system");

            const formData = new FormData();
            formData.append('file', selectedFile);
            
            // Append selected instruments
            selectedInstruments.forEach(inst => {
                formData.append('instruments', inst);
            });

            // Note: Our server_gui.py loads the specified model size on startup.
            // If the user wants to run a different model, they restart the server with that model.
            // Here, we just log the request configuration.
            addLog(`Requesting transcription (Model loaded on server: ${modelSizeSelect.value})`, "system");

            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || `Server responded with status ${response.status}`);
                }

                transcribeStatus.textContent = 'Transcribing...';
                
                // Read the Stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop(); // Keep the partial line in buffer

                    for (const line of lines) {
                        const cleanLine = line.trim();
                        if (cleanLine.startsWith("data: ")) {
                            try {
                                const event = JSON.parse(cleanLine.slice(6));
                                handleServerEvent(event);
                            } catch (e) {
                                console.error("Error parsing event line:", cleanLine, e);
                            }
                        }
                    }
                }
            } catch (e) {
                console.error("Transcription failed:", e);
                transcribeStatus.textContent = 'Failed';
                addLog(`Error: ${e.message}`, "note-on");
            } finally {
                btnTranscribe.disabled = false;
                btnRemoveFile.disabled = false;
            }
        });

        // Event parser
        function handleServerEvent(event) {
            if (event.type === 'progress') {
                const percent = Math.round((event.completed / event.total) * 100);
                progressBar.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
                transcribeStatus.textContent = `Processing chunk ${event.completed} of ${event.total}`;
            } 
            else if (event.type === 'start') {
                addLog(`NOTE ON: Pitch ${event.pitch}, Velocity ${event.velocity}, Instrument: ${event.program}`, "note-on");
            } 
            else if (event.type === 'end') {
                addLog(`NOTE OFF: Event index ref ${event.start_event_index} (at ${event.end_time.toFixed(2)}s)`, "note-off");
            } 
            else if (event.type === 'midi') {
                progressBar.style.width = `100%`;
                progressPercent.textContent = `100%`;
                transcribeStatus.textContent = `Complete`;
                addLog("Received MIDI file payload!", "system");
                
                generatedMidiBase64 = event.data;
                // Convert base64 to binary bytes
                const binaryStr = atob(event.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }
                generatedMidiBytes = bytes;

                resultPanel.style.display = 'flex';
            }
        }

        // Action: Download MIDI
        btnDownloadMidi.addEventListener('click', () => {
            if (!generatedMidiBytes) return;
            
            const blob = new Blob([generatedMidiBytes], { type: 'audio/midi' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            // Clean original filename and append .mid
            const origName = selectedFile ? selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) : 'transcription';
            a.download = `${origName}.mid`;
            a.href = url;
            a.click();
            
            // Clean up
            setTimeout(() => URL.revokeObjectURL(url), 100);
        });

        // Action: Auralize (Synthesize MIDI back to WAV audio)
        btnAuralize.addEventListener('click', async () => {
            if (!generatedMidiBytes) return;

            addLog("Synthesizing transcribed MIDI into WAV audio...", "system");
            btnAuralize.disabled = true;

            try {
                // Convert MIDI bytes back to a file
                const midiBlob = new Blob([generatedMidiBytes], { type: 'audio/midi' });
                const formData = new FormData();
                formData.append('midi', midiBlob, 'transcription.mid');
                formData.append('mode', 'synth'); // synthesis only

                const response = await fetch('/auralize', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Synthesis server error: ${response.status}`);
                }

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                
                audioPlayer.src = audioUrl;
                audioPlayback.style.display = 'flex';
                audioPlayer.play();
                
                addLog("Synthesis complete! Loading player...", "system");
            } catch (e) {
                console.error("Auralization failed:", e);
                addLog(`Synthesis failed: ${e.message}`, "note-on");
            } finally {
                btnAuralize.disabled = false;
            }
        });
    </script>
</body>
</html>
